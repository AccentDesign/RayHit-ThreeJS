<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rayhit-three — Structural collapse</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #0b0c0f; color: #e7e7ea; overflow: hidden; }
  #ui { position: fixed; top: 12px; left: 12px; z-index: 10; width: 244px;
    background: #181a20cc; backdrop-filter: blur(6px); border: 1px solid #2a2d36; border-radius: 10px; padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { color:#8b90a0; font-size:11px; margin-bottom:10px; }
  label { display:block; margin:8px 0 2px; color:#aab; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  .val { float:right; color:#9fd; }
  input[type=range], select { width:100%; }
  button { width:100%; margin-top:8px; padding:9px; border:0; border-radius:7px; background:#ff7a18; color:#fff; font-weight:600; cursor:pointer; }
  button.alt { background:#2a2d36; } button.blue{ background:#4f7cff; }
  button:hover { filter:brightness(1.1); }
  #stat { margin-top:10px; color:#7fd6a0; font-size:11px; min-height:14px; }
  #legend { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: #181a20cc; backdrop-filter: blur(6px); border: 1px solid #2a2d36; border-radius: 10px;
    padding: 9px 14px; display: flex; gap: 14px; align-items: center; font-size: 12px; color: #c7ccd6; flex-wrap: wrap; justify-content: center; max-width: 92vw; }
  kbd { background: #2a2d36; border: 1px solid #3a3e48; border-bottom-width: 2px; border-radius: 5px;
    padding: 1px 6px; font: 600 11px/1.4 ui-monospace, monospace; color: #e7e7ea; margin-right: 4px; }
  #legend .g { color: #7a8089; }
  #legend .hot { color: #ff9d5c; }
</style>
</head>
<body>
<div id="ui">
  <h1>rayhit-three</h1>
  <div class="sub">structural integrity &amp; collapse</div>
  <label>Structure</label>
  <select id="structure"><option value="tower">Tower</option><option value="wall">Wall</option><option value="cantilever">Cantilever (overhang)</option></select>
  <label>Shards <span class="val" id="amountV">90</span></label>
  <input type="range" id="amount" min="20" max="220" value="90" />
  <label>Ball damage radius <span class="val" id="dmgV">1.8</span></label>
  <input type="range" id="dmg" min="0.3" max="6" step="0.1" value="1.8" />
  <button id="ball" class="blue">Launch wrecking ball  (Space)</button>
  <button id="bomb">Blast the base  (B)</button>
  <button id="stress" class="alt">Gravity stress: OFF  (G)</button>
  <button id="rebuild" class="alt">Rebuild  (R)</button>
  <div id="stat">loading…</div>
</div>
<div id="legend">
  <span class="hot"><kbd>G</kbd>Gravity stress — try the Cantilever!</span>
  <span><kbd>L-click</kbd>Knock out a shard</span>
  <span><kbd>Space</kbd>Wrecking ball</span>
  <span><kbd>B</kbd>Blast base</span>
  <span><kbd>R</kbd>Rebuild</span>
  <span class="g">drag to orbit</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "../node_modules/three/build/three.module.js",
    "three/addons/": "../node_modules/three/examples/jsm/",
    "@dimforge/rapier3d-compat": "../node_modules/@dimforge/rapier3d-compat/rapier.mjs",
    "rayhit-three": "../src/index.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import RAPIER from '@dimforge/rapier3d-compat';
import { shatter, setThree, RayHitMan, RapierAdapter, RayHitConnectivity, MaterialType, SimType, FadeType } from 'rayhit-three';

setThree(THREE);
const $ = id => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c0f); scene.fog = new THREE.Fog(0x0b0c0f, 25, 70);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(11, 8, 15);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xbfd3ff, 0x14161c, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(9, 16, 7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = sun.shadow.camera.bottom = -22; sun.shadow.camera.right = sun.shadow.camera.top = 22;
scene.add(sun);

const phys = new RapierAdapter(RAPIER, { THREE, gravity: [0, -22, 0], contactForceThreshold: 5 });
const man = new RayHitMan({ THREE, scene, physics: phys, fragmentLimit: 4000, groundY: 0 });
let con = null, ready = false, shardRigids = [];

const stoneMat = new THREE.MeshStandardMaterial({ color: 0xb3b9c4, roughness: 0.9 });
const innerMat = new THREE.MeshStandardMaterial({ color: 0x6f6256, roughness: 1 });
const ballMat = new THREE.MeshStandardMaterial({ color: 0x3a3f4b, roughness: 0.25, metalness: 0.8 });

function clearStructure() {
  for (const r of shardRigids) { if (r.mesh.parent) { phys.removeBody(r.mesh); r.mesh.parent.remove(r.mesh); } }
  man.clear(); man.rigids.clear(); shardRigids = [];
}

async function build() {
  clearStructure();
  const kind = $('structure').value, amount = +$('amount').value;
  // dimensions, placement and which shards are anchors, per structure
  let dims, pos, anchorPred;
  if (kind === 'tower') { dims = [2.4, 9, 2.4]; pos = [0, 4.5, 0]; anchorPred = n => n.aabb.min.y < 0.15; }
  else if (kind === 'wall') { dims = [10, 5, 1.4]; pos = [0, 2.5, 0]; anchorPred = n => n.aabb.min.y < 0.15; }
  else { dims = [9, 1.3, 1.3]; pos = [0.5, 5.4, 0]; anchorPred = n => n.aabb.min.x < -3.2; } // cantilever anchored at its left end

  const src = new THREE.Mesh(new THREE.BoxGeometry(...dims), stoneMat);
  src.position.set(...pos);
  const { fragments } = await shatter(src, { type: 'voronoi', amount, seed: 7, THREE, innerMaterial: innerMat });

  shardRigids = [];
  for (const f of fragments) {
    const m = f.mesh; m.castShadow = m.receiveShadow = true; scene.add(m);
    const r = man.addRigid(m, { simType: SimType.Kinematic, material: MaterialType.Concrete, collider: 'hull',
      fade: { type: FadeType.None } });
    shardRigids.push(r);
  }
  // connectivity + load-stress (RFStress)
  con = new RayHitConnectivity(man, {
    connectionType: 'boundingBox', overlap: 0.06, activateImpulse: 0.4,
    stressStrength: 7, weightByVolume: false,
    onActivate: node => { const c = node.aabb.getCenter(new THREE.Vector3()); man.emitDust([c.x, c.y, c.z], { amount: 6, size: 0.4, lifetime: 1 }); },
  });
  con.setShards(shardRigids, anchorPred).build().start();
  const s = con.stats();
  const tip = kind === 'cantilever' ? 'turn on Gravity stress (G) to watch it snap' : 'click / launch / bomb';
  $('stat').textContent = `${s.total} shards · ${s.anchors} anchored · ${tip}`;
}

// knock a shard out: free it (dynamic + kick) and drop it from the support graph
function knockOut(mesh, impulse) {
  const node = con && con.byMesh.get(mesh);
  if (!node || node.removed || node.anchor) return;
  phys.setBodyType(mesh, 'dynamic');
  if (node.rigid) node.rigid.simType = SimType.Dynamic;
  if (impulse) phys.setLinearVelocity(mesh, impulse);
  node.active = true;
  con.removeShard(mesh);     // remove from graph -> cascade unsupported shards above
}

// click to knock out a shard
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !ready) return;
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(shardRigids.map(r => r.mesh), false)[0];
  if (hit) {
    knockOut(hit.object, [0, 1, 0]);
    man.emitDust([hit.point.x, hit.point.y, hit.point.z], { amount: 14, size: 0.5, color: 0xcfcabb });
    man.emitDebris([hit.point.x, hit.point.y, hit.point.z], { amount: 10, size: 0.08, color: 0x6f6256 });
  }
});

function launchBall() {
  if (!ready) return;
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.9, 24, 16), ballMat);
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  ball.position.copy(camera.position).addScaledVector(dir, 2); ball.castShadow = true; scene.add(ball);
  const r = man.addRigid(ball, { simType: SimType.Dynamic, material: MaterialType.HeavyMetal, collider: 'sphere', fade: { type: FadeType.Destroy, lifetime: 10 } });
  phys.setLinearVelocity(ball, [dir.x * 38, dir.y * 38 + 2, dir.z * 38]);
  ball.userData.isBall = true;
  man.registerFragment(r);
}

function blastBase() {
  if (!ready || !con) return;
  con.activateAt([0, 0.8, 0], 3.5, 6);
  man.emitDust([0, 0.8, 0], { amount: 60, size: 0.9, color: 0xcfcabb, spread: 3, lifetime: 1.8 });
  man.emitDebris([0, 0.8, 0], { amount: 40, size: 0.12, color: 0x6f6256, speed: 7, spread: 2 });
}

// wrecking ball hitting a held shard does AREA damage: it punches out a sphere
// of shards around the impact (radius = damage slider), scaled by impact force,
// then connectivity cascades whatever lost support above the hole.
// onContact is edge-triggered (fires on the initial hit, not while resting),
// so a ball that comes to rest on a block won't keep spawning dust/debris.
phys.onContact((a, b, imp) => {
  const ball = a && a.userData.isBall ? a : (b && b.userData.isBall ? b : null);
  const shard = ball === a ? b : a;
  const node = ball && shard && con && con.byMesh.get(shard);
  if (!node || node.removed || node.active || node.anchor) return;  // only fresh held shards
  const baseR = +$('dmg').value;
  // harder hits punch a slightly bigger hole, but the debris KICK is capped to a
  // sane m/s (the raw contact force is huge for a fast heavy ball — never feed it
  // straight into velocity, or shards fly for miles).
  const radius = baseR * (1 + Math.min(0.5, imp / 1500));
  const kick = Math.min(8, 3 + baseR);     // m/s outward burst, capped
  const p = shard.getWorldPosition(new THREE.Vector3());
  con.activateAt([p.x, p.y, p.z], radius, kick);
  man.emitDust([p.x, p.y, p.z], { amount: 26, size: 0.7, color: 0xcfcabb, spread: radius * 0.6 });
  man.emitDebris([p.x, p.y, p.z], { amount: 20, size: 0.1, color: 0x6f6256, speed: 5, spread: radius * 0.4 });
});

// Gravity stress (RFStress): when ON, repeatedly apply load-stress so overloaded
// parts (e.g. a cantilever) crack and fall under their own weight.
let stressOn = false, stressAccum = 0;
function toggleStress() { stressOn = !stressOn; $('stress').textContent = `Gravity stress: ${stressOn ? 'ON' : 'OFF'}  (G)`; $('stress').classList.toggle('warn', stressOn); }

$('amount').addEventListener('input', () => $('amountV').textContent = $('amount').value);
$('dmg').addEventListener('input', () => $('dmgV').textContent = $('dmg').value);
$('ball').addEventListener('click', launchBall);
$('bomb').addEventListener('click', blastBase);
$('stress').addEventListener('click', toggleStress);
$('rebuild').addEventListener('click', () => { build(); });
$('structure').addEventListener('change', build);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); launchBall(); } else if (e.key === 'b') blastBase(); else if (e.key === 'g') toggleStress(); else if (e.key === 'r') build(); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const ground = new THREE.Mesh(new THREE.BoxGeometry(60, 1, 60), new THREE.MeshStandardMaterial({ color: 0x21242b, roughness: 1 }));
ground.position.y = -0.5; ground.receiveShadow = true; scene.add(ground);
scene.add(new THREE.GridHelper(60, 60, 0x2a2d36, 0x16181e));

const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, clock.getDelta());
  if (ready) {
    man.update(dt);
    if (stressOn && con) { stressAccum += dt; if (stressAccum > 0.1) { stressAccum = 0; con.stressStep(); } }
  }
  controls.update();
  renderer.render(scene, camera);
})();

(async () => {
  await RAPIER.init(); await man.init();
  man.addRigid(ground, { simType: SimType.Static });
  await build(); ready = true;
  window.__c = { man, phys, get con() { return con; }, get shards() { return shardRigids; } };
})().catch(e => { $('stat').textContent = 'Error: ' + e.message; console.error(e); });
</script>
</body>
</html>
