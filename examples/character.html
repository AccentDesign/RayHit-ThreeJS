<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rayhit-three — Character shatter</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #0d0e12; color: #e7e7ea; overflow: hidden; }
  #ui { position: fixed; top: 12px; left: 12px; z-index: 10; width: 234px;
    background: #181a20cc; backdrop-filter: blur(6px); border: 1px solid #2a2d36; border-radius: 10px; padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { color: #8b90a0; font-size: 11px; margin-bottom: 10px; }
  label { display:block; margin: 9px 0 3px; color:#aab; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  select, input[type=range] { width: 100%; }
  .val { float:right; color:#9fd; font-variant-numeric:tabular-nums; }
  button { width: 100%; margin-top: 10px; padding: 9px; border: 0; border-radius: 7px; background: #4f7cff; color:#fff; font-weight: 600; cursor: pointer; }
  button.alt { background:#2a2d36; } button.warn{ background:#ff5a4f; }
  button:hover { filter: brightness(1.1); }
  #stat { margin-top:10px; color:#7fd6a0; font-size:11px; min-height:14px; }
  #hint { position: fixed; bottom: 10px; left: 12px; color: #6b7080; font-size: 11px; }
</style>
</head>
<body>
<div id="ui">
  <h1>rayhit-three</h1>
  <div class="sub">fracturing a Fable character</div>
  <label>Model</label>
  <select id="model">
    <option value="king">King (character)</option>
    <option value="skeleton">Skeleton soldier</option>
    <option value="statue">Knight statue</option>
  </select>
  <label>Fragment type</label>
  <select id="type">
    <option value="voronoi">Voronoi</option>
    <option value="splinters">Splinters</option>
    <option value="slabs">Slabs</option>
    <option value="tets">Tets</option>
  </select>
  <label>Amount <span class="val" id="amountV">60</span></label>
  <input type="range" id="amount" min="5" max="300" value="60" />
  <label>Explode <span class="val" id="explodeV">0.0</span></label>
  <input type="range" id="explode" min="0" max="100" value="0" />
  <button id="go">Shatter</button>
  <button id="drop" class="warn">Drop &amp; shatter (physics)</button>
  <button id="reset" class="alt">Reset</button>
  <div id="stat">loading…</div>
</div>
<div id="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "../node_modules/three/build/three.module.js",
    "three/addons/": "../node_modules/three/examples/jsm/",
    "@dimforge/rapier3d-compat": "../node_modules/@dimforge/rapier3d-compat/rapier.mjs",
    "rayhit-three": "../src/index.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import RAPIER from '@dimforge/rapier3d-compat';
import { shatter, setThree, RayHitMan, RapierAdapter, MaterialType, SimType, FadeType } from 'rayhit-three';

setThree(THREE);
const $ = id => document.getElementById(id);

const MODELS = {
  king:     { file: 'models/king.fbx',          type: 'fbx', atlas: 'models/atlas_fantasychars.png', inner: 0x7a3b34, material: MaterialType.Wood },
  skeleton: { file: 'models/skeleton.fbx',      type: 'fbx', atlas: 'models/atlas_generic.png',       inner: 0xe8e2d0, material: MaterialType.PorousRock },
  statue:   { file: 'models/knight_statue.glb', type: 'glb', atlas: null,                              inner: 0x8d8d96, material: MaterialType.DenseRock },
};

// ---- renderer / scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0e12);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(3.5, 3, 5.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xbfd3ff, 0x1a1c22, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.position.set(5, 9, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -8; sun.shadow.camera.right = sun.shadow.camera.top = 8;
scene.add(sun);
const groundMesh = new THREE.Mesh(new THREE.CircleGeometry(20, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x21242b, roughness: 1 }));
groundMesh.receiveShadow = true; scene.add(groundMesh);
scene.add(new THREE.GridHelper(40, 40, 0x2a2d36, 0x16181e));

const gltfLoader = new GLTFLoader(), fbxLoader = new FBXLoader(), texLoader = new THREE.TextureLoader();

let displayMesh = null, solidGeom = null, outerMat = null, innerMat = null, modelKey = null;
let fragGroup = null, frags = [];
let man = null, phys = null, physReady = false, physRunning = false;

/** Merge all sub-meshes of a loaded root into a single centred, scaled geometry. */
function extractGeometry(root, targetHeight = 2.6) {
  root.updateMatrixWorld(true);
  const geoms = [];
  root.traverse(o => {
    if ((o.isMesh || o.isSkinnedMesh) && o.geometry && o.geometry.attributes.position) {
      let g = o.geometry.clone();
      for (const name of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(name)) g.deleteAttribute(name);
      if (!g.attributes.normal) g.computeVertexNormals();
      if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
      g.applyMatrix4(o.matrixWorld);
      geoms.push(g.index ? g.toNonIndexed() : g);
    }
  });
  if (!geoms.length) throw new Error('no mesh geometry found');
  let merged = geoms.length === 1 ? geoms[0] : mergeGeometries(geoms, false);
  // normalize: center on origin XZ + sit on ground, scale to target height
  merged.computeBoundingBox();
  const bb = merged.boundingBox, size = new THREE.Vector3(); bb.getSize(size);
  const s = targetHeight / (size.y || 1);
  const cx = (bb.min.x + bb.max.x) / 2, cz = (bb.min.z + bb.max.z) / 2;
  merged.translate(-cx, -bb.min.y, -cz);
  merged.scale(s, s, s);
  merged.computeVertexNormals();
  merged.computeBoundingBox();
  return merged;
}

/** Stand-in figure used when no model file is supplied, so the demo still runs. */
function placeholderGeometry() {
  const g = new THREE.CapsuleGeometry(0.55, 1.5, 8, 16); // ~2.6 units tall, watertight
  g.translate(0, 1.3, 0);                                // sit on the ground
  g.computeVertexNormals();
  return g;
}

async function loadModel(key) {
  $('stat').textContent = 'loading model…';
  resetView(true);
  modelKey = key;
  const m = MODELS[key];
  let placeholder = false;
  try {
    let root;
    if (m.type === 'glb') root = (await gltfLoader.loadAsync(m.file)).scene;
    else root = await fbxLoader.loadAsync(m.file);
    solidGeom = extractGeometry(root);
  } catch (e) {
    // No model supplied (assets aren't shipped) — fall back to a placeholder so
    // the fracturing still demonstrates. Bring your own: drop a model in
    // examples/models/ and update MODELS above (see examples/models/README.md).
    solidGeom = placeholderGeometry();
    placeholder = true;
  }

  // outer material: atlas texture if any (skipped for the placeholder), else a tone
  let tex = null;
  if (m.atlas && !placeholder) { tex = await texLoader.loadAsync(m.atlas).catch(() => null); if (tex) { tex.colorSpace = THREE.SRGBColorSpace; tex.flipY = false; } }
  outerMat = new THREE.MeshStandardMaterial({ map: tex, color: tex ? 0xffffff : 0xb9c0cc, roughness: 0.78, metalness: 0.05 });
  innerMat = new THREE.MeshStandardMaterial({ color: m.inner, roughness: 1 });

  displayMesh = new THREE.Mesh(solidGeom, outerMat);
  displayMesh.castShadow = true; displayMesh.receiveShadow = true;
  scene.add(displayMesh);

  const tris = solidGeom.attributes.position.count / 3;
  $('stat').textContent = placeholder
    ? `no "${m.file}" — fracturing a placeholder. Drop your own model in examples/models/ (see README).`
    : `${key} · ${tris | 0} triangles · ready`;
}

function clearFragments() {
  if (fragGroup) { scene.remove(fragGroup); fragGroup.traverse(o => o.geometry?.dispose?.()); }
  fragGroup = null; frags = [];
  if (man) man.clear();
  physRunning = false;
}

function resetView(keepStat) {
  clearFragments();
  if (displayMesh) { scene.remove(displayMesh); displayMesh.geometry?.dispose?.(); displayMesh = null; }
  if (!keepStat) $('stat').textContent = '';
}

function fragOptions() {
  const type = $('type').value, amount = +$('amount').value;
  const o = { type, amount, seed: 1, THREE, innerMaterial: innerMat, seedInside: true };
  if (type === 'splinters' || type === 'slabs') { o.axis = 'y'; o.strength = 0.6; }
  if (type === 'tets') o.tets = { density: Math.max(3, Math.cbrt(amount) | 0 + 2), noise: 0.5 };
  return o;
}

async function doShatter() {
  if (!displayMesh) return;
  $('go').disabled = true; $('stat').textContent = 'fracturing…';
  await new Promise(r => requestAnimationFrame(r));
  const t0 = performance.now();
  const src = new THREE.Mesh(solidGeom, outerMat);
  const result = await shatter(src, fragOptions());
  const ms = (performance.now() - t0).toFixed(0);
  displayMesh.visible = false;
  clearFragments();
  fragGroup = result.group; scene.add(fragGroup);
  const c = new THREE.Vector3();
  frags = result.fragments.map(f => {
    const base = f.mesh.position.clone();
    const dir = base.clone().sub(c); if (dir.lengthSq() < 1e-6) dir.set(Math.random() - .5, Math.random() - .5, Math.random() - .5);
    return { mesh: f.mesh, base, dir: dir.normalize(), spin: new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5) };
  });
  $('stat').textContent = `${frags.length} fragments · ${ms} ms`;
  $('go').disabled = false;
  $('explode').value = 0; $('explodeV').textContent = '0.0';
  applyExplode();
}

function applyExplode() {
  const e = +$('explode').value / 100;
  for (const f of frags) {
    f.mesh.position.copy(f.base).addScaledVector(f.dir, e * 2.2);
    f.mesh.rotation.set(f.spin.x * e * 3, f.spin.y * e * 3, f.spin.z * e * 3);
  }
}

async function dropShatter() {
  if (!displayMesh) return;
  if (!physReady) {
    await RAPIER.init();
    phys = new RapierAdapter(RAPIER, { THREE, gravity: [0, -18, 0] });
    man = new RayHitMan({ THREE, scene, physics: phys, fragmentLimit: 4000 });
    await man.init();
    const g = new THREE.Mesh(new THREE.BoxGeometry(40, 1, 40), groundMesh.material);
    g.position.y = -0.5; scene.add(g);
    man.addRigid(g, { simType: SimType.Static });
    physReady = true;
  }
  $('stat').textContent = 'fracturing…';
  await new Promise(r => requestAnimationFrame(r));
  const m = MODELS[modelKey];
  const src = new THREE.Mesh(solidGeom, outerMat);
  const result = await shatter(src, fragOptions());
  displayMesh.visible = false;
  clearFragments();
  fragGroup = result.group; scene.add(fragGroup);
  // give each fragment a dynamic body + a little outward kick
  const center = new THREE.Vector3(0, 1.3, 0);
  for (const f of result.fragments) {
    const fm = f.mesh;
    const r = man.addRigid(fm, { simType: SimType.Dynamic, material: m.material, collider: 'hull',
      fade: { type: FadeType.ScaleDown, lifetime: 7, duration: 2.5 } });
    const dir = fm.getWorldPosition(new THREE.Vector3()).sub(center);
    const d = dir.length() || 1; dir.multiplyScalar(1 / d);
    phys.setLinearVelocity(fm, [dir.x * 2.5, 2 + Math.random() * 2, dir.z * 2.5]);
    phys.setAngularVelocity(fm, [(Math.random() - .5) * 4, (Math.random() - .5) * 4, (Math.random() - .5) * 4]);
    man.registerFragment(r);
  }
  physRunning = true;
  $('stat').textContent = `${result.fragments.length} fragments falling…`;
}

['amount', 'explode'].forEach(id => $(id).addEventListener('input', () => {
  $(id + 'V').textContent = id === 'explode' ? (+$(id).value / 100).toFixed(1) : $(id).value;
  if (id === 'explode' && !physRunning) applyExplode();
}));
$('go').addEventListener('click', doShatter);
$('drop').addEventListener('click', dropShatter);
$('reset').addEventListener('click', () => loadModel(modelKey));
$('model').addEventListener('change', e => loadModel(e.target.value));

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, clock.getDelta());
  if (physRunning && man) man.update(dt);
  controls.update();
  renderer.render(scene, camera);
})();

loadModel('king').catch(e => { $('stat').textContent = 'Error: ' + e.message; console.error(e); });
</script>
</body>
</html>
